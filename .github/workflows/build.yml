name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar o JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Baixar e Instalar o Gradle 6.7.1
      run: |
        wget -q https://services.gradle.org/distributions/gradle-6.7.1-bin.zip
        unzip -q gradle-6.7.1-bin.zip
        echo "$PWD/gradle-6.7.1/bin" >> $GITHUB_PATH

    - name: Criar projeto limpo sem dependências complexas
      run: |
        mkdir -p app/src/main/java/com/seuusuario/netflixlite
        mkdir -p app/src/main/res/layout

        # 1. build.gradle raiz
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "com.android.tools.build:gradle:4.1.3"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 2. settings.gradle
        echo "include ':app'" > settings.gradle

        # 3. build.gradle do app
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            compileSdkVersion 30
            defaultConfig {
                applicationId "com.seuusuario.netflixlite"
                minSdkVersion 19
                targetSdkVersion 30
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.seuusuario.netflixlite">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:allowBackup="true"
                android:label="Netflix Lite"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity
                    android:name=".MainActivity"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:label="Netflix Lite">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                        <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. activity_main.xml
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="@android:color/black">
            <WebView
                android:id="@+id/webViewNetflix"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:focusable="true"
                android:focusableInTouchMode="true" />
        </RelativeLayout>
        EOF

        # 6. MainActivity.java ultra-estável
        cat << 'EOF' > app/src/main/java/com/seuusuario/netflixlite/MainActivity.java
        package com.seuusuario.netflixlite;

        import android.annotation.SuppressLint;
        import android.app.Activity;
        import android.os.Bundle;
        import android.view.KeyEvent;
        import android.view.View;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView webView;

            @SuppressLint("SetJavaScriptEnabled")
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                webView = (WebView) findViewById(R.id.webViewNetflix);
                WebSettings settings = webView.getSettings();
                
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setLoadsImagesAutomatically(true);
                settings.setSupportZoom(false);
                settings.setBuiltInZoomControls(false);

                webView.setLayerType(View.LAYER_TYPE_SOFTWARE, null);
                settings.setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");

                webView.setWebViewClient(new WebViewClient() {
                    @Override
                    public boolean shouldOverrideUrlLoading(WebView view, String url) {
                        view.loadUrl(url);
                        return true;
                    }
                });

                webView.loadUrl("https://www.netflix.com/br/");
            }

            @Override
            public boolean onKeyDown(int keyCode, KeyEvent event) {
                if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                    webView.goBack();
                    return true;
                }
                return super.onKeyDown(keyCode, event);
            }

            @Override
            protected void onDestroy() {
                if (webView != null) {
                    webView.destroy();
                }
                super.onDestroy();
            }
        }
        EOF

    - name: Compilar o APK (Debug)
      run: gradle assembleDebug --stacktrace

    - name: Salvar o APK gerado como artefato
      uses: actions/upload-artifact@v4
      with:
        name: app-netflix-lite-debug
        path: app/build/outputs/apk/debug/app-debug.apk
