name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar o JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Baixar e Instalar o Gradle
      run: |
        wget https://services.gradle.org/distributions/gradle-7.5-bin.zip
        unzip -q gradle-7.5-bin.zip
        echo "$PWD/gradle-7.5/bin" >> $GITHUB_PATH

    - name: Criar estrutura correta do projeto
      run: |
        mkdir -p app/src/main/java/com/seuusuario/netflixlite
        mkdir -p app/src/main/res/layout

        # Cria o build.gradle raiz de forma segura
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "com.android.tools.build:gradle:7.4.2"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # Cria o settings.gradle
        echo "include ':app'" > settings.gradle

        # Cria o build.gradle do app
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            compileSdkVersion 33
            defaultConfig {
                applicationId "com.seuusuario.netflixlite"
                minSdkVersion 19
                targetSdkVersion 33
                versionCode 1
                versionName "1.0"
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Compilar o APK (Debug)
      run: gradle assembleDebug --stacktrace

    - name: Salvar o APK gerado como artefato
      uses: actions/upload-artifact@v4
      with:
        name: app-netflix-lite-debug
        path: app/build/outputs/apk/debug/app-debug.apk
