name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar o JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Criar estrutura do projeto e Gradle automaticamente
      run: |
        # Cria a estrutura de pastas padrão do Android se não existirem
        mkdir -p app/src/main/java/com/seuusuario/netflixlite
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/mipmap

        # Cria o arquivo build.gradle do projeto raiz
        echo 'buildscript { repositories { google() mavenCentral() } dependencies { classpath "com.android.tools.build:gradle:7.4.2" } } allprojects { repositories { google() mavenCentral() } }' > build.gradle

        # Cria o arquivo settings.gradle
        echo "include ':app'" > settings.gradle

        # Cria o arquivo build.gradle do app com suporte ao Android 4.4 (minSdk 19)
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdkVersion 33
            defaultConfig {
                applicationId "com.seuusuario.netflixlite"
                minSdkVersion 19
                targetSdkVersion 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # Gera o gradlew utilizando o gradle do sistema
        gradle wrapper --gradle-version 7.5

    - name: Dar permissão de execução ao Gradle
      run: chmod +x gradlew

    - name: Compilar o APK (Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: Salvar o APK gerado como artefato
      uses: actions/upload-artifact@v4
      with:
        name: app-netflix-lite-debug
        path: app/build/outputs/apk/debug/app-debug.apk
